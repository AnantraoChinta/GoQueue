# The GoQueue HTTP API that accepts job submissions.
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: goqueue
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: goqueue
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: scheduler
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Must match the extraPortMapping in deploy/kind-config.yaml, which
      # forwards it to localhost:8080 on the host.
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: goqueue
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: goqueue
spec:
  # Stateless, so replicas are purely about availability during rolling
  # updates rather than throughput.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      annotations:
        # Opt in to the annotation-driven discovery in monitoring.yaml.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/part-of: goqueue
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # the distroless "nonroot" user
      containers:
        - name: scheduler
          image: goqueue-scheduler:dev
          # Never: the image is side-loaded with `kind load docker-image`
          # and does not exist in any registry, so a pull would always fail.
          imagePullPolicy: Never
          args: ["-addr=:8080"]
          env:
            - name: GOQUEUE_REDIS_ADDR
              value: redis.goqueue.svc.cluster.local:6379
            - name: GOQUEUE_LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
          # startupProbe gives the container a generous window to come up
          # while Redis is still appearing. Liveness and readiness are
          # suspended until this first succeeds, so a slow start cannot be
          # mistaken for a wedged process. 2s x 45 = 90s, which exceeds the
          # 60s -redis-connect-timeout.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 45
          # Liveness must NOT touch Redis. If it did, a brief Redis outage
          # would restart every scheduler pod - an outage you caused.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          # Readiness may check Redis. Failing it only removes the pod from
          # the Service; it does not restart the container.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
