# Redis for the GoQueue job queue.
#
# A StatefulSet, not a Deployment. Redis holds the queue on disk (the
# append-only file), and only a StatefulSet gives it a stable identity plus
# a PersistentVolumeClaim that survives rescheduling. With a Deployment and
# an emptyDir, a node drain silently discards every queued job - which
# contradicts GoQueue's "no job is lost" guarantee.
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: goqueue
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: goqueue
spec:
  # Headless (clusterIP: None) is what gives StatefulSet pods stable DNS.
  # Clients still address it as redis:6379 from inside the namespace.
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: goqueue
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: goqueue
    app.kubernetes.io/component: queue
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: goqueue
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            # CRITICAL for a queue: the default eviction policy silently
            # deletes keys under memory pressure, losing jobs with no
            # error anywhere. noeviction makes Redis reject writes instead,
            # so the scheduler sees a visible failure it can retry.
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # No CPU limit on purpose: a limit throttles rather than kills,
            # and a throttled Redis adds latency to every job claim.
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
